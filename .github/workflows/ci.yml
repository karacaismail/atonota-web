# Sürekli bütünleştirme kapıları. Action'lar tam commit SHA'sına sabitlenir.
# Firefox koşulmaz (proje kararı). Tarayıcılar: Chromium ve WebKit.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  checks:
    name: Lint, typecheck ve birim testleri
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Depoyu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Node kur
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Bağımlılıkları kur
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Birim testleri
        run: npm test
      - name: Derleme
        run: npm run build

  e2e:
    name: Playwright (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - name: Depoyu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Node kur
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Bağımlılıkları kur
        run: npm ci
      # Önbellek, deneme başına süre sınırı, yeniden deneme ve ayna sırası:
      # .github/actions/playwright-browsers/install.sh
      - name: Tarayıcıyı kur
        uses: ./.github/actions/playwright-browsers
        with:
          browsers: ${{ matrix.browser }}
      - name: Tarayıcı testleri
        run: npx playwright test --grep "${{ matrix.browser == 'chromium' && '^chromium-' || '^(webkit-|iphone-13)' }}"
      - name: Raporu sakla
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7
